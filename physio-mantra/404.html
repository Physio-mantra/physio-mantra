<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page Not Found | Physio मंत्र</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'DM Sans', sans-serif;
            background: #0B1C3A;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .error-container {
            text-align: center;
            max-width: 600px;
            padding: 40px;
        }
        
        .error-code {
            font-family: 'Cormorant Garamond', serif;
            font-size: 120px;
            font-weight: 600;
            color: #C8622A;
            line-height: 1;
            margin-bottom: 20px;
        }
        
        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 36px;
            color: white;
            margin-bottom: 16px;
        }
        
        p {
            color: rgba(255,255,255,0.7);
            font-size: 18px;
            margin-bottom: 32px;
        }
        
        .buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn-primary, .btn-outline {
            display: inline-block;
            padding: 12px 28px;
            border-radius: 9999px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: #C8622A;
            color: white;
        }
        
        .btn-primary:hover {
            background: #b85622;
            transform: scale(1.03);
        }
        
        .btn-outline {
            border: 2px solid #C8622A;
            color: #C8622A;
            background: transparent;
        }
        
        .btn-outline:hover {
            background: rgba(200,98,42,0.1);
            transform: scale(1.03);
        }
        
        @media (max-width: 768px) {
            .error-code { font-size: 80px; }
            h1 { font-size: 28px; }
            p { font-size: 16px; }
            .buttons { flex-direction: column; }
            .btn-primary, .btn-outline { width: 100%; text-align: center; }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">404</div>
        <h1>Page Not Found</h1>
        <p>Sorry, the page you're looking for doesn't exist or has been moved.</p>
        <div class="buttons">
            <a href="index.html" class="btn-primary">← Back to Home</a>
            <a href="tel:+919876543210" class="btn-outline">Call Us</a>
        </div>
    </div>
</body>
</html>
